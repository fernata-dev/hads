<text x="40" y="84" class="bar">ghost text = hads' prediction · → accepts it</text>
<g class="s1"><text x="40" y="112" class="p">❯</text><text x="62" y="112" class="ink">git com</text><rect class="t2" x="60" y="96" width="69.2" height="22" fill="#0b1018"/></g><g class="s3"><text x="125.2" y="112" class="ghost">mit -m "fix: login redirect"</text><rect x="392.0" y="97" rx="6" width="110.9" height="21" class="chip"/><text x="400.0" y="112" class="why">after git add</text></g><g class="s4"><rect x="60" y="95" width="778" height="24" fill="#0b1018"/><text x="62" y="112" class="ink">git commit -m "fix: login redirect"</text><text x="390.0" y="112" class="ok">✔</text></g><g class="s5"><text x="40" y="146" class="p">❯</text></g><g class="s6"><text x="62.0" y="146" class="ghost">git push</text><rect x="148.2" y="131" rx="6" width="154.7" height="21" class="chip"/><text x="156.2" y="146" class="why">1 commit not pushed</text></g><g class="s7"><rect x="60" y="129" width="778" height="24" fill="#0b1018"/><text x="62" y="146" class="ink">git push</text><text x="146.2" y="146" class="ok">✔</text></g><g class="s8"><text x="40" y="180" class="p">❯</text><text x="62" y="180" class="ink">cp rep</text><rect class="t9" x="60" y="164" width="60.2" height="22" fill="#0b1018"/></g><g class="s10"><text x="116.2" y="180" class="ghost">  ⟶ cp Documents/report-2026.pdf ~/Desktop/</text><rect x="518.5" y="165" rx="6" width="125.5" height="21" class="chip"/><text x="526.5" y="180" class="why">your usual spot</text></g><g class="s11"><rect x="60" y="163" width="778" height="24" fill="#0b1018"/><text x="62" y="180" class="ink">cp Documents/report-2026.pdf ~/Desktop/</text><text x="426.2" y="180" class="ok">✔</text></g><g class="s12"><text x="40" y="214" class="p">❯</text><text x="62" y="214" class="ink">cd web</text><rect class="t13" x="60" y="198" width="60.2" height="22" fill="#0b1018"/></g><g class="s14"><text x="116.2" y="214" class="ghost">  ⟶ cd ~/code/webapp</text><rect x="310.8" y="199" rx="6" width="125.5" height="21" class="chip"/><text x="318.8" y="214" class="why">frequent folder</text></g><g class="s15"><rect x="60" y="197" width="778" height="24" fill="#0b1018"/><text x="62" y="214" class="ink">cd ~/code/webapp</text><text x="218.5" y="214" class="ok">✔</text></g><g class="s16"><text x="40" y="248" class="p">❯</text><text x="62" y="248" class="ink">gti pu</text><rect class="t17" x="60" y="232" width="60.2" height="22" fill="#0b1018"/></g><g class="s18"><text x="116.2" y="248" class="ghost">  ⟶ git push</text><rect x="238.5" y="233" rx="6" width="89.0" height="21" class="chip"/><text x="246.5" y="248" class="why">typo fixed</text></g><g class="s19"><rect x="60" y="231" width="778" height="24" fill="#0b1018"/><text x="62" y="248" class="ink">git push</text><text x="146.2" y="248" class="ok">✔</text></g><g class="s20"><text x="40" y="304" class="p">❯</text><text x="62" y="304" class="ink">? update the system and install claude code</text><rect class="t21" x="60" y="288" width="403.3" height="22" fill="#0b1018"/></g><g class="s22"><text x="62" y="334" class="num">1</text><text x="84" y="334" class="dim">Full system upgrade</text><text x="272" y="334" class="cmd">$ sudo pacman -Syu --noconfirm</text><text x="820" y="334" text-anchor="end" fill="#ffb86b" class="sm">medium</text></g><g class="s23"><text x="62" y="358" class="num">2</text><text x="84" y="358" class="dim">Install Claude Code</text><text x="272" y="358" class="cmd">$ curl -fsSL https://claude.ai/install.sh | bash</text><text x="820" y="358" text-anchor="end" fill="#ffb86b" class="sm">medium</text></g><g class="s24"><text x="62" y="382" class="num">3</text><text x="84" y="382" class="dim">Verify</text><text x="272" y="382" class="cmd">$ claude --version</text><text x="820" y="382" text-anchor="end" fill="#7ee2a8" class="sm">low</text></g>
