name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hads version
      description: Output of `hads version`
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options: [zsh, bash, fish, PowerShell, other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: e.g. Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `hads status`
      render: text
